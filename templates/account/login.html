{% load socialaccount %} {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Hangarin Login</title>
    <!-- Bootstrap + MDB + Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" />
    <style>
        /* --- Page Background & Fonts --- */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #535397, #092a7e);
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: #f0f0f0;
        }

        /* --- Card Styles --- */
        .auth-card {
            max-width: 450px;
            width: 100%;
            background: #384b64af;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgb(15, 50, 146);
            padding: 2.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        }

        /* --- Nav Pills --- */
        .nav-pills .nav-link.active {
            background: #ec486394;
            color: #fff;
            font-weight: 600;
            border-radius: 50px;
        }

        .nav-pills .nav-link {
            color: #c5c5c5;
            font-weight: 500;
            border-radius: 50px;
        }

        /* --- Input Fields --- */
        .form-outline input.form-control {
            background: #0f1624;
            border: 1px solid #333;
            color: #fff;
            border-radius: 10px;
        }

        .form-outline input.form-control:focus {
            border-color: #942739;
            box-shadow: 0 0 5px rgba(233, 69, 96, 0.425);
        }

        .form-label {
            color: #c5c5c5;
        }

        /* --- Buttons --- */
        .btn-primary {
            background: #ec486394;
            border: none;
            border-radius: 50px;
            padding: 0.6rem 2rem;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
            background: #f80e3594;
            transform: translateY(-2px);
        }

        .btn-link.btn-floating i {
            color: #ec486394;
            transition: transform 0.2s ease;
        }

        .btn-link.btn-floating:hover i {
            transform: scale(1.3);
        }

        /* --- Alerts --- */
        .alert-danger {
            background-color: #ff4c5b;
            color: #fff;
            border-radius: 10px;
        }

        /* --- Remember Me & Forgot Password --- */
        .form-check-label, .col-md-6 a {
            color: #c5c5c5;
        }

        .col-md-6 a:hover {
            color: #e94560;
            text-decoration: underline;
        }

        /* --- Tab Content Fade Animation --- */
        .tab-pane {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .tab-pane.show.active {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>
<div class="auth-card">
    <!-- Pills navs -->
    <ul class="nav nav-pills nav-justified mb-3" id="ex1" role="tablist">
        <li class="nav-item" role="presentation">
            <a class="nav-link active" id="tab-login" data-mdb-toggle="pill" href="#pills-login" role="tab" aria-controls="pills-login" aria-selected="true">Login</a>
        </li>
        <li class="nav-item" role="presentation">
            <a class="nav-link" id="tab-register" data-mdb-toggle="pill" href="#pills-register" role="tab" aria-controls="pills-register" aria-selected="false">Register</a>
        </li>
    </ul>
    
    <!-- Pills content -->
    <div class="tab-content">
        <!-- Login tab -->
        <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="tab-login">
            <form method="post" action="{% url 'account_login' %}" autocomplete="off">
                {% csrf_token %}
                <div class="text-center mb-3">
                    <p>Sign in with:</p>
                    <a href="{% provider_login_url 'google' %}" class="btn btn-link btn-floating mx-1">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="{% provider_login_url 'github' %}" class="btn btn-link btn-floating mx-1">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
                <p class="text-center">or:</p>
                <div class="form-outline mb-4" data-mdb-input-init>
                    <input type="text" name="login" id="id_login" class="form-control" required autocomplete="off" />
                    <label class="form-label" for="id_login">Email or Username</label>
                </div>
                <div class="form-outline mb-4" data-mdb-input-init>
                    <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password" />
                    <label class="form-label" for="id_password">Password</label>
                </div>
                <div class="row mb-4">
                    <div class="col-md-6 d-flex justify-content-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="loginCheck" checked />
                            <label class="form-check-label" for="loginCheck"> Remember me </label>
                        </div>
                    </div>
                    <div class="col-md-6 d-flex justify-content-center">
                        <a href="{% url 'account_reset_password' %}">Forgot password?</a>
                    </div>
                </div>
                {% if form.non_field_errors %}
                    <div class="alert alert-danger" role="alert">
                        {% for error in form.non_field_errors %}<p class="mb-0">{{ error }}</p>{% endfor %}
                    </div>
                {% endif %}
                <button type="submit" class="btn btn-primary btn-block mb-4">Sign in</button>
            </form>
        </div>

        <!-- Register tab -->
        <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="tab-register">
            <form method="post" action="{% url 'account_signup' %}" autocomplete="off">
                {% csrf_token %}
                <div class="text-center mb-3">
                    <p>Sign up with:</p>
                    <a href="{% provider_login_url 'google' %}" class="btn btn-link btn-floating mx-1">
                        <i class="fab fa-google"></i>
                    </a>
                </div>
                <p class="text-center">or:</p>
                <div class="form-outline mb-4" data-mdb-input-init>
                    <input type="text" name="username" id="registerUsername" class="form-control" required autocomplete="off" />
                    <label class="form-label" for="registerUsername">Username</label>
                </div>
                <div class="form-outline mb-4" data-mdb-input-init>
                    <input type="email" name="email" id="registerEmail" class="form-control" required autocomplete="off" />
                    <label class="form-label" for="registerEmail">Email</label>
                </div>
                <div class="form-outline mb-4" data-mdb-input-init>
                    <input type="password" name="password1" id="registerPassword" class="form-control" required autocomplete="new-password" />
                    <label class="form-label" for="registerPassword">Password</label>
                </div>
                <div class="form-outline mb-4" data-mdb-input-init>
                    <input type="password" name="password2" id="registerRepeatPassword" class="form-control" required autocomplete="new-password" />
                    <label class="form-label" for="registerRepeatPassword">Repeat password</label>
                </div>
                <button type="submit" class="btn btn-primary btn-block mb-3">Register</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"></script>
<script>
    document.querySelectorAll('.form-outline').forEach((formOutline) => {
        new mdb.Input(formOutline).init();
    });
</script>
</body>
</html>
